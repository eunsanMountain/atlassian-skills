name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Publish to PyPI & Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Lock-freshness gate (release-blocking)
        # MUST be the first project-aware uv command. A non-locked `uv run` (such
        # as the version check below) silently regenerates a stale lock, so if it
        # ran first the gate would inspect an auto-fixed lock and pass — defeating
        # itself. Nothing that can mutate uv.lock runs before this. It only passes
        # once the required cfxmark is on PyPI and uv.lock is regenerated against it.
        run: uv lock --check

      - name: Verify tag matches pyproject version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          # --locked: a stale lock fails here (exit 2), never gets rewritten.
          PKG_VERSION=$(uv run --locked --with tomli python -c "import tomli, pathlib; print(tomli.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match pyproject.toml version ($PKG_VERSION)"
            exit 1
          fi
          echo "Version match: $TAG_VERSION"

      - name: Run tests
        run: |
          uv sync --locked --all-extras
          uv run pytest -m "not integration"

      - name: Build distribution
        run: uv build

      - name: Verify PyPI version is absent
        run: python .github/scripts/check_pypi_version_absent.py atlassian-skills "${GITHUB_REF_NAME#v}"

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES_FILE=release-notes.md

          # 1. Version-specific section (between "## [X.Y.Z]" and the next "## [")
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { flag=1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md > section.md

          # 2. Top-level "Upgrading" block (between "## Upgrading" and either "---" or the first versioned "## [")
          awk '
            /^## Upgrading/ { flag=1; print; next }
            flag && /^---$/ { exit }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md > upgrade.md

          if [ -s section.md ]; then
            echo "Using CHANGELOG section for ${VERSION}"
            cp section.md "$NOTES_FILE"
          else
            echo "No CHANGELOG section found, generating fallback"
            echo "## atlassian-skills v${VERSION}" > "$NOTES_FILE"
            echo "" >> "$NOTES_FILE"
            echo "### Install" >> "$NOTES_FILE"
            echo '```bash' >> "$NOTES_FILE"
            echo "uv tool install atlassian-skills==${VERSION}" >> "$NOTES_FILE"
            echo '```' >> "$NOTES_FILE"
          fi

          # 3. Append the shared Upgrading block so every release carries upgrade instructions
          if [ -s upgrade.md ]; then
            printf '\n---\n\n' >> "$NOTES_FILE"
            cat upgrade.md >> "$NOTES_FILE"
          fi

          echo "" >> "$NOTES_FILE"
          PREV_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${GITHUB_REF_NAME}" >> "$NOTES_FILE"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          files: |
            dist/*.whl
            dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
