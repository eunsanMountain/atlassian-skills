[project]
name = "atlassian-skills"
version = "0.4.3"
description = "Token-efficient CLI + Claude Code Skill for Atlassian Server/DC (Jira, Confluence, Bitbucket, Bamboo)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Eunsan Jo" }]
keywords = [
    "atlassian",
    "jira",
    "confluence",
    "bitbucket",
    "bamboo",
    "cli",
    "claude-code",
    "mcp-alternative",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.5",
    "tomli; python_version < '3.11'",
    "tomli-w",
    # Pinned to the exact measured build, not the compatible range, because the
    # preservation registry binds capabilities to a converter string:
    # `ragged-table-island-v1` names `("cfxmark 0.6.1", "editable")` and the identity
    # carry names `cfxmark 0.6.1`. That binding is deliberate -- a capability must not
    # be inherited by a build it was never measured against -- but it fails *silently*:
    # on 0.6.2 both simply stop matching, `canonical_write_permitted` drops, and nothing
    # is raised. The release lock must pin 0.6.1 so CI can never see it; until
    # cfxmark 0.6.1 is published, this tree deliberately retains the 0.6.0
    # registry lock instead of recording a non-portable local-wheel path.
    # Widening this range therefore means re-measuring the capabilities and moving
    # their build strings in the same change.
    "cfxmark>=0.6.1,<0.6.2",
    "platformdirs",
    "keyring>=24",
    "truststore>=0.10",
]

[project.optional-dependencies]
# Retained as a no-op alias so `pip install "atlassian-skills[keyring]"` (the pre-0.2.8
# instruction) keeps working — keyring is now a base dependency.
keyring = ["keyring>=24"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio",
    "respx>=0.21",
    "syrupy>=4",
    "tiktoken",
    "ruff>=0.5",
    "mypy>=1.10",
    "tomli",  # needed by mypy (python_version=3.10) to check the tomli fallback branch in core/config.py
    # Bounded HERE and not in `[project.dependencies]`, deliberately. `atls --help`
    # and every runtime path work on typer 0.27 -- measured on 0.24.1, 0.25.1,
    # 0.26.0, 0.26.8 and 0.27.0 -- so capping what users may install would cost
    # them a resolver conflict and buy nothing.
    #
    # There are two boundaries and they are at different versions:
    #
    #   0.26.0  Typer vendored Click. `typer.main.get_command` returns objects
    #           built on `typer._click`, so `isinstance(x, click.Command)` against
    #           an externally installed Click answers False -- silently, dropping
    #           the inventory from 201 entries to 1. Nothing here imports Click any
    #           more, so this one no longer breaks anything.
    #
    #   0.27.0  The vendored Click renamed its parameter type names, "text" ->
    #           "str" and "integer" -> "int". That moves 576 recorded params and
    #           the compatibility gate reports every one as a surface change.
    #
    # The bound is set at the FIRST of them, which is the conservative choice and
    # the one the release plan specifies. It is not the minimum: the full suite is
    # green on 0.26.0 and 0.26.8, measured, so raising this to `<0.27` needs no
    # code change. Going past 0.27 does: `tests/support/cli_inventory._type_name`
    # has to normalise the renamed spellings, or the fixture has to be re-recorded
    # with an entry saying the 576 deltas are Click's rename and not ours.
    # Re-recording quietly would erase the signal the gate exists to give.
    "typer<0.26",
]

[project.scripts]
atls = "atlassian_skills.cli.main:entrypoint"

[project.urls]
Repository = "https://github.com/eunsanMountain/atlassian-skills"
Issues = "https://github.com/eunsanMountain/atlassian-skills/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlassian_skills"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]
exclude = [
    "/.omc",
    "/.omx",
    "/references",
    # Belt and braces. These are internal working records -- captured pytest
    # transcripts, per-unit progress notes, the blocker ledger -- carrying this
    # organisation's Jira keys, Confluence page ids and absolute local paths. They are
    # gitignored now and so cannot reach a build from a clean checkout, but
    # `include = ["/docs"]` is a directory-wide rule and would pick them straight back
    # up from a working tree that still has them on disk.
    "/docs/release-evidence",
    "/docs/release-0.3.4-runbook.md",
]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".omc", ".omx", "references"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "C4",  # comprehensions
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "SIM108", # ternary preference
    "SIM102", # nested-if collapse
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]
"src/atlassian_skills/cli/**/*.py" = ["B008"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
exclude = ["build/", "dist/", "references/", "tests/"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "integration: Tests requiring live Atlassian instance",
    "snapshot: Golden-file snapshot tests",
    "benchmark: Token benchmark tests",
]
